name: Publish Docker images

# Images are published from a *published release*, never from a bare tag push.
# A tag that is later deleted (the versioning rule consolidates unreleased tags)
# would otherwise leave its image tags behind in GHCR forever, and dependency
# bots read those as a newer version. See issue #87.
on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          # target coach: a imagem padrao nao traz runtime de IA, e esta instancia usa o AI Coach.
          - image: api
            context: ./api
            file: ./api/Dockerfile
            target: coach
          - image: web
            context: .
            file: ./web/Dockerfile
            target: ''
    steps:
      - uses: actions/checkout@v7

      - name: Lowercase owner (registry names must be lowercase)
        id: repo
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Set version metadata
        id: version_meta
        run: |
          # On a release the ref is refs/tags/vX.Y.Z; on a main push it is a branch ref,
          # which would otherwise label the image "refs/heads/main".
          case "$GITHUB_REF" in
            refs/tags/*) VERSION="${GITHUB_REF#refs/tags/}" ;;
            *)           VERSION="main-${GITHUB_SHA::7}" ;;
          esac
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "VCS_REF=${GITHUB_SHA}" >> $GITHUB_OUTPUT
          echo "BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_OUTPUT

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v6
        id: meta
        with:
          # Nome proprio: o fork antigo (holandaandre/opengym) publica em opengym-api/web e as duas
          # bases de codigo nao podem dividir a mesma tag latest.
          images: ghcr.io/${{ steps.repo.outputs.owner }}/opengym-oficial-${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          # So amd64: a VPS que roda esta instancia e' x86_64, e o npm ci do target coach
          # morre com SIGILL (exit 132) sob emulacao QEMU do arm64.
          platforms: linux/amd64
          build-args: |
            VERSION=${{ steps.version_meta.outputs.VERSION }}
            VCS_REF=${{ steps.version_meta.outputs.VCS_REF }}
            BUILD_DATE=${{ steps.version_meta.outputs.BUILD_DATE }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
